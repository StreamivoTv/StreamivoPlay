name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.streamivo --project-name streamivo .
          rm -rf test

      - name: TV banner and manifest (Android TV, Fire TV, mobile)
        run: |
          mkdir -p android/app/src/main/res/drawable-xhdpi
          cp tv/banner.png android/app/src/main/res/drawable-xhdpi/banner.png
          python3 tools/patch_manifest.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Streamivo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
