name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.streamivo --project-name streamivo .
          rm -rf test

      - name: TV banner and manifest (Android TV, Fire TV, mobile)
        run: |
          mkdir -p android/app/src/main/res/drawable-xhdpi
          cp tv/banner.png android/app/src/main/res/drawable-xhdpi/banner.png
          python3 tools/patch_manifest.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      # The file is always called STREAMIVOTV.apk
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk STREAMIVOTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STREAMIVOTV
          path: STREAMIVOTV.apk

      # Fixed download link: Releases > latest > STREAMIVOTV.apk (plain APK, no zip)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest STREAMIVOTV.apk --title "STREAMIVOTV" --notes "Latest STREAMIVOTV.apk" --latest
